name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_DB: agentpulse
  POSTGRES_USER: agentpulse
  POSTGRES_PASSWORD: agentpulse
  REDIS_URL: redis://localhost:6379/0

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: ruff check src tests && ruff format --check src tests

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: mypy src/ --show-error-codes --show-error-context

  test-unit:
    name: Tests - Unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest -m "not integration" -v

  test-integration:
    name: Tests - Integration (pytest -m integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: agentpulse
          POSTGRES_USER: agentpulse
          POSTGRES_PASSWORD: agentpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentpulse -d agentpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pytest -v -m integration --tb=short
        env:
          TEST_DATABASE_URL: postgresql://agentpulse:agentpulse@localhost:5432/agentpulse

  lockfile:
    name: Lockfile (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Comparar freeze com o arquivo commitado
        run: |
          pip freeze --exclude-editable | sort > /tmp/freeze.txt
          sort requirements.lock > /tmp/lock.txt
          if ! diff /tmp/lock.txt /tmp/freeze.txt; then
            echo "::error::requirements.lock inconsistente com o ambiente instalado"
            exit 1
          fi
      - name: Idade das versoes (>= 14 dias)
        run: python .github/scripts/verify_versions.py