name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_DB: agentpulse
  POSTGRES_USER: agentpulse
  POSTGRES_PASSWORD: agentpulse
  REDIS_URL: redis://localhost:6379/0

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check src/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install mypy ruff pytest pytest-asyncio pytest-cov
          pip install types-redis==5.0.1.2 types-pyyaml==6.0.12.2 types-sqlalchemy==1.4.53.38 types-requests==2.33.0.20261006 types-urllib3==1.26.25.14
          pip install psycopg[pool] sqlalchemy langgraph langgraph-checkpoint-postgres celery redis fastapi uvicorn pydantic pydantic-settings pyyaml prometheus-client python-json-logger tenacity opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-celery opentelemetry-instrumentation-psycopg opentelemetry-semantic-conventions
      - name: Run mypy
        run: mypy src/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: agentpulse
          POSTGRES_USER: agentpulse
          POSTGRES_PASSWORD: agentpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentpulse -d agentpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install psycopg[pool] sqlalchemy langgraph langgraph-checkpoint-postgres celery redis fastapi uvicorn pydantic pydantic-settings pyyaml prometheus-client python-json-logger tenacity opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-celery opentelemetry-instrumentation-psycopg opentelemetry-semantic-conventions
      - name: Run tests
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=0