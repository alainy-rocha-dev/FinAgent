name: Generate lockfile
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Venv novo e instalação
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -e ".[dev,migrate]"
      - name: Freeze
        run: /tmp/venv/bin/pip freeze --exclude-editable > requirements.lock.new
      - name: Conferir conteúdo
        run: |
          wc -l requirements.lock.new
          grep -iE '^(altair|colorama|pywin32)==' requirements.lock.new && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-linux-lock
          path: requirements.lock.new
          if-no-files-found: error