<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulos 2D (Force Graph) — sisanalisefinanceira</title>
    <meta name="reversa-category" content="diagram">
    <meta name="reversa-producer-agent" content="reversa-docs-mapper">
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --border-color: #30363d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 10;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .header-title span {
            color: var(--accent-color);
        }
        nav.reversa-doc-nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        nav.reversa-doc-nav a:hover, nav.reversa-doc-nav a.active {
            background: var(--border-color);
            color: var(--accent-color);
        }
        #graph-container {
            width: 100vw;
            height: 100vh;
        }
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node text {
            fill: #c9d1d9;
            font-size: 12px;
            pointer-events: none;
        }
        .link {
            stroke: #30363d;
            stroke-opacity: 0.8;
            stroke-width: 2px;
        }
    </style>
    <script src="assets/vendor/d3.v7.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/nav.js"></script>
</head>
<body>
    <header>
        <div class="header-title">
            🔗 <span>sisanalisefinanceira</span> — Módulos & Dependências 2D
        </div>
        <nav class="reversa-doc-nav"></nav>
    </header>

    <div id="graph-container"></div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const data = window.RV_DATA.deps;

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(140))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .selectAll("line")
            .data(data.links)
            .enter().append("line")
            .attr("class", "link");

        const colorMap = {
            domain: "#58a6ff",
            engine: "#a371f7",
            support: "#f0883e",
            data: "#238636"
        };

        const node = svg.append("g")
            .selectAll(".node")
            .data(data.nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", 18)
            .attr("fill", d => colorMap[d.group] || "#58a6ff");

        node.append("text")
            .attr("dx", 22)
            .attr("dy", ".35em")
            .text(d => d.label);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
