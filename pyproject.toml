[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpulse"
version = "0.1.0"
description = "AgentPulse - Financial Analysis Multi-Agent Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "arocha", email = "arocha@example.com"}
]
keywords = ["finance", "agents", "langgraph", "celery", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core infrastructure
    "celery==5.6.0",
    "redis==7.4.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[pool]==3.3.2",
    "asyncpg==0.30.0",
    "sqlalchemy==2.0.35",
    # Configuration
    "pyyaml==6.0.1",
    "pydantic==2.11.5",
    "pydantic-settings==2.11.0",
    # API
    "fastapi==0.115.10",
    "uvicorn[standard]==0.32.0",
    # Observability
    "opentelemetry-api>=1.25.0,<1.28",
    "opentelemetry-sdk>=1.25.0,<1.28",
    "opentelemetry-exporter-otlp>=1.25.0,<1.28",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<0.48",
    "opentelemetry-instrumentation-celery>=0.46b0,<0.48",
    "opentelemetry-instrumentation-psycopg>=0.46b0,<0.48",
    "opentelemetry-semantic-conventions>=0.46b0,<0.49",
    "prometheus-client==0.19.0",
    # Utilities
    "python-json-logger==2.0.7",
    "tenacity==8.2.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "pytest-mock==3.13.1",
    "httpx==0.27.2",
    # Linting
    "ruff==0.6.5",
    "mypy==1.11.1",
    # Type stubs
    "types-redis==5.0.1.2",
    "types-pyyaml==6.0.12.2",
    "types-sqlalchemy==1.4.53.38",
    "types-requests==2.33.0.20261006",
    "types-urllib3==1.26.25.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
]
per-file-ignores = { "tests/*" = ["S101", "S106"] }
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "langgraph.*",
    "langgraph_checkpoint.*",
    "psycopg.*",
    "psycopg_pool",
    "sqlalchemy.*",
    "asyncpg.*",
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "yaml",
    "python_json_logger",
    "tenacity",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentpulse*"]

[tool.setuptools.package-dir]
"" = "src"